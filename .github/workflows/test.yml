name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev
      - run: mkdir -p bin
      - name: Test
        run: mise exec -- odin test src -out:bin/galaxies_test${{ runner.os == 'Windows' && '.exe' || '' }} -define:ODIN_TEST_THREADS=1
      - name: Build
        run: mise exec -- odin build src -out:bin/galaxies${{ runner.os == 'Windows' && '.exe' || '' }} -o:speed
      - uses: actions/upload-artifact@v7
        with:
          name: galaxies-${{ runner.os }}
          path: bin/galaxies*
